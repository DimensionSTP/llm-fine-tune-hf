[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fine-tune-hf"
version = "2.10.8"
description = "LLM/VLM fine-tuning and evaluation pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "absl-py==2.4.0",
    "accelerate==1.13.0",
    "albumentations==2.0.8",
    "bitsandbytes==0.49.2",
    "causal-conv1d==1.6.2.post1",
    "datasets==4.8.3",
    "deepspeed==0.18.8",
    "faiss-cpu==1.13.2",
    "flash-linear-attention==0.5.2",
    "flashinfer-cubin @ https://github.com/flashinfer-ai/flashinfer/releases/download/v0.6.14/flashinfer_cubin-0.6.14-py3-none-any.whl#sha256=7bbed9f3851b59f3f6f6cb344810775bbce8a1c012ecf9a502bebd91cfb6433e",
    "flashinfer-jit-cache @ https://github.com/flashinfer-ai/flashinfer/releases/download/v0.6.14/flashinfer_jit_cache-0.6.14%2Bcu129-cp39-abi3-manylinux_2_28_x86_64.whl",
    "huggingface-hub==1.19.0",
    "hydra-core==1.3.2",
    "kernels==0.15.2",
    "liger_kernel==0.8.0",
    "mlflow==3.13.0",
    "nltk==3.9.3",
    "num2words==0.5.14",
    "numpy==2.3.5",
    "nvidia-ml-py==13.595.45",
    "omegaconf==2.3.0",
    "openai==2.25.0",
    "opencv-python-headless==4.13.0.92",
    "packaging==26.2",
    "pandas==3.0.1",
    "peft==0.18.1",
    "pillow==12.1.1",
    "pyarrow==23.0.1",
    "python-dotenv==1.2.2",
    "rouge_score==0.1.2",
    "safetensors==0.8.0",
    "scikit-learn==1.8.0",
    "tokenizers==0.22.2",
    "torch==2.11.0",
    "tqdm==4.67.3",
    "transformers==5.14.1",
    "trl==1.10.0",
    "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.26.0/vllm-0.26.0%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl",
    "wandb==0.25.1",
]

[project.optional-dependencies]
gpu = [
    "flash-attn @ git+https://github.com/Dao-AILab/flash-attention.git@060c9188beec3a8b62b33a3bfa6d5d2d44975fab",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
