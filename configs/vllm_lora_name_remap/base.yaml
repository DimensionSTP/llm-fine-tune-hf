# @package _global_
vllm_lora_name_remap:
  selection: auto
  default_profile: passthrough
  version_packages:
    - peft
    - transformers
    - trl
    - vllm
  profiles:
    passthrough:
      prefix_rules: []
    qwen_text_causal_to_conditional:
      prefix_rules:
        - source_prefix: model.
          target_prefix: language_model.model.
  selectors:
    - name: qwen35_qwen36_text_current_stack
      model_patterns:
        - Qwen3.5-*
        - Qwen/Qwen3.5-*
        - Qwen3.6-*
        - Qwen/Qwen3.6-*
      modalities: [text]
      package_versions:
        peft: ==0.21.2
        transformers: ==5.19.0
        trl: ==1.15.0
        vllm: ==0.31.0
      profile: qwen_text_causal_to_conditional
  resolved_profile: null
  resolved_selector: null
  runtime_package_versions: {}