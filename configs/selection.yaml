# @package _global_
defaults:
  - dataset: selection
  - dataset_artifact: base
  - image_augmentation: base
  - dataloader_runtime: auto
  - memory_preflight: base
  - tracking: mlflow
  - notifications: slack
  - training_arguments: selection
  - trainer: selection
  - vllm_lora_name_remap: base
  - deepspeed: ds_config
  - model_loading: train_runtime
  - vision_patch_embedding: base
  - peft_initialization: lora
  - run_metadata: allocation
  - dense_to_moe: dense_to_moe
  - hydra: hydra
  - selector: base
  - _self_

package_name: llm-fine-tune-hf
project_dir: ${oc.env:PROJECT_DIR}/${package_name}
connected_dir: ${oc.env:CONNECTED_DIR}/${package_name}

modality: vision
fine_tune_method: selection

seed: 2026

data_type: conversational

split:
  train: train
  val: val

batch_size: 1
eval_batch_size: 1

split_ratio: 1e-2
is_strict_split: false

dataset_name: evidence_selector_${selection_task}
dataset_format: jsonl
data_path: ${connected_dir}/data
dataset_subdir: null
dataset_file_path: null
dataset_file_paths: null
dataset_files: null
allow_dataset_file_name_mismatch: false
val_dataset_file_path: null
val_dataset_file_paths: null
val_dataset_files: null
allow_val_dataset_file_name_mismatch: false
dataset_resampling:
  enabled: false
  strategy: weighted_offline
  replacement: false
  target_size: null
test_dataset_subdir: ${test_data_dir}
test_dataset_file_path: null
test_dataset_file_paths: null
test_dataset_files: null
allow_test_dataset_file_name_mismatch: false
is_preprocessed: false
data_column_name: input
conversation_column_name: messages
role_column_name: role
content_column_name: content
assistant_column_name: assistant
max_pixels: null
do_resize: false
dataset_image:
  image_root_dir: ${data_path}
  convert_unsupported_extensions: true
  unsupported_path_extensions:
    - tif
    - tiff
  converted_image_mode: RGB
upload_user: Qwen
model_type: Qwen3.5-9B
pretrained_model_name: ${upload_user}/${model_type}
merge_path: ${connected_dir}/merged
merge_max_shard_size: null
merge_pack_qwen_moe_experts: false
custom_data_encoder_path: ${merge_path}/${pretrained_model_name}
revision: null
reference_data_encoder_name: Qwen/Qwen3.5-9B
left_padding: false
is_enable_thinking: false
merged_model_path: ${merge_path}/${pretrained_model_name}
max_length: null
pad_to_multiple_of: null

user_name: ${oc.env:USER_NAME}
model_detail: ${model_type}
upload_tag: selection
model_path: ${user_name}/${model_detail}-${upload_tag}

precision: bf16
attn_implementation: flash_attention_2

is_quantized: false
quantization_config:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
is_peft: true
peft_config:
  r: 64
  lora_alpha: 256
  target_modules: all-linear
  lora_dropout: 0.0
  bias: none
  task_type: CAUSAL_LM
  inference_mode: false

gradient_checkpointing: false
gradient_checkpointing_kwargs:
  use_reentrant: false

optim: adamw_torch
lr: null
head_lr: ${lr}
weight_decay: 0.0

scheduler_type: cosine
warmup_steps: 0

distributed:
  enabled: false
  num_machines: 1
  num_processes_per_machine: null
  machine_rank: ${oc.decode:${oc.env:MACHINE_RANK,0}}
  main_process_ip: ${oc.env:MAIN_PROCESS_IP,127.0.0.1}
  main_process_port: ${oc.decode:${oc.env:MAIN_PROCESS_PORT,29500}}
  validation_mode: warn

devices: ${oc.decode:${oc.env:DEVICES,null}}
strategy: deepspeed
logging_steps: 10
is_bf16: true
gradient_accumulation_steps: 1
max_grad_norm: 1
epoch: null
max_steps: -1
step: 250

model_name: VLM-Selection
mode: train

project_name: ${model_name}-${effective_dataset_name}-${mode}
peft_info: is_quantized=${is_quantized}-is_peft=${is_peft}
peft_detail: r=${peft_config.r}-a=${peft_config.lora_alpha}
length_info: max_length=${max_length}
save_detail: ${model_detail}-${peft_info}-${peft_detail}-${length_info}
logging_name: ${save_detail}-lr${lr}

run_id: null
output_base_dir: ${connected_dir}/checkpoints/${model_name}/${effective_dataset_name}/${strategy}/${save_detail}
output_dir: null
save_strategy: steps
save_total_limit: null

resume_training: false
resume_from_checkpoint: null
use_validation: false
eval_strategy: "no"

peft_test:
  adapter_path: ${output_dir}
  adapter_name: default

test_data_dir: benchmarks/test
test_output_dir: ${connected_dir}/tests/${model_detail}/selection
run_name: ${project_name}
work_dir: ${hydra:runtime.cwd}


selection_task: kv
selection_inputs:
  model_name: qwen3_5_9b
  processor_path: ${pretrained_model_name}
  tokenizer_cache_size: 128
  chat_template:
    add_generation_prompt: false
    enable_thinking: false
    add_vision_id: false

dataloader_runtime:
  num_workers_per_process: 0
  persistent_workers: false
  prefetch_factor: null
  pin_memory: false

input_contract:
  pooling: ${selector.pooling}
  task: ${selection_task}
  processor_path: ${selection_inputs.processor_path}
  revision: ${revision}
  selection_inputs: ${selection_inputs}
  row_request_contract: ${selector.table.row_request_contract}
  record_request_contract: ${selector.table.record_request_contract}
  train_data_file: ${dataset_file_path}
  eval_data_file: ${val_dataset_file_path}
model_reference:
  model_path: ${pretrained_model_name}
  revision: ${revision}
  lora: ${peft_config}
  initialization_adapter: ${peft_initialization.adapter_path}