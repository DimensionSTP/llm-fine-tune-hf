# @package _global_
vision_patch_embedding:
  mode: native
  dimensions:
    - 2
    - 3
  auto_probe:
    startup_timeout_seconds: 60
    operation_timeout_seconds: 30
    warmup_iterations: 1
    measurement_iterations: 3
    patch_counts:
      - 1
      - 256
      - 1024
      - 4096
    slowdown_ratio: 2.0
    minimum_slowdown_milliseconds: 10.0
    fp32_equivalence_atol: 1.0e-3
    fp32_equivalence_rtol: 1.0e-3
    runtime_equivalence_atol: 1.0e-2
    runtime_equivalence_rtol: 1.0e-2